syntax = "proto3";

package advanced;

import "google/protobuf/field_mask.proto";
import "protoc-gen-fieldmask/options.proto";

option go_package = "github.com/yeqown/protoc-gen-fieldmask/examples/03_advanced;advanced";

// Product represents a product in an e-commerce system.
message Product {
  string product_id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
}

// Order represents an order.
message Order {
  string order_id = 1;
  repeated string product_ids = 2;
  double total_amount = 3;
}

// OrderDetail represents order details (cross-package example).
message OrderDetail {
  string order_id = 1;
  repeated Product products = 2;
  double total_amount = 3;
  string status = 4;
}

// GetOrderRequest gets order with product details.
message GetOrderRequest {
  string order_id = 1;
  google.protobuf.FieldMask fm = 2;
}

// GetOrderResponse returns order and products.
message GetOrderResponse {
  string order_id = 1;
  repeated Product products = 2;
  double total_amount = 3;
  string status = 4;
}

// UpdateOrderRequest updates order information.
message UpdateOrderRequest {
  string order_id = 1;
  repeated string product_ids = 2;  // Will be ignored via field option
  double total_amount = 3;
  google.protobuf.FieldMask fm = 4;
}

// OrderService demonstrates advanced features:
// - Multiple RPCs with different modes
// - Field-level ignore option
service OrderService {
  // GetOrder uses FILTER mode - only masked fields in response
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (protoc_gen_fieldmask.rpc) = {
      field_name: "fm"
      mode: FILTER
    };
  }

  // UpdateOrder uses PRUNE mode - masked fields excluded from update
  rpc UpdateOrder(UpdateOrderRequest) returns (GetOrderResponse) {
    option (protoc_gen_fieldmask.rpc) = {
      field_name: "fm"
      mode: PRUNE
    };
  }
}

// ProductOptions demonstrates field-level options.
message ProductOptions {
  // product_ids will be ignored for FieldMask generation
  repeated string product_ids = 1 [(protoc_gen_fieldmask.field) = {ignore: true}];
  double total_amount = 2;
  google.protobuf.FieldMask fm = 3;
}
